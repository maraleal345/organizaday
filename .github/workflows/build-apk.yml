name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Gerar ícone do app (opcional)
        continue-on-error: true
        run: npx --yes @capacitor/assets@3 generate --android

      - name: Permitir uso da câmera
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Pintar a barra de status de azul
        run: |
          sed -i 's|<item name="android:background">@null</item>|<item name="android:background">@null</item><item name="android:statusBarColor">#1d4ed8</item><item name="android:navigationBarColor">#1d4ed8</item>|' android/app/src/main/res/values/styles.xml
          grep -c statusBarColor android/app/src/main/res/values/styles.xml || echo "aviso: barra de status nao alterada"

      - name: Instalar o código nativo da barra de navegação
        run: |
          cp android-extra/NavBarPlugin.java android-extra/MainActivity.java android/app/src/main/java/com/agenda/remessas/
          ls android/app/src/main/java/com/agenda/remessas/

      - name: Usar a chave fixa de assinatura
        run: |
          mkdir -p ~/.android
          cp signing/agenda.keystore ~/.android/debug.keystore

      - name: Copiar o app para o Android
        run: npx cap sync android

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk organizador-diario.apk

      - uses: actions/upload-artifact@v4
        with:
          name: organizador-diario-apk
          path: organizador-diario.apk
