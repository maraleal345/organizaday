<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>Organizador Diário</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0;--ac:#1d4ed8;--ac2:#3b82f6;--soft:#eaf0ff;--ok:#059669;--okb:#d1fae5;--dn:#dc2626;--sh:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.06);color-scheme:light;
box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c2e;--tx:#e8edf6;--mut:#8b9ab3;--bd:#233049;--ac:#60a5fa;--ac2:#3b82f6;--soft:#17274a;--ok:#34d399;--okb:#0d3a2e;--dn:#f87171;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#131c2e;--tx:#e8edf6;--mut:#8b9ab3;--bd:#233049;--ac:#60a5fa;--ac2:#3b82f6;--soft:#17274a;--ok:#34d399;--okb:#0d3a2e;--dn:#f87171;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.w{max-width:1040px;margin:0 auto;padding:0 16px}
main{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;margin-top:12px;padding-bottom:12px}
#app{width:100%}#app.fw{max-width:none;flex:1;min-height:0;padding:0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh)}
.ch{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--bd)}
.ch h2{margin:0;font-size:20px;letter-spacing:-.02em;text-transform:capitalize}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--bd);background:var(--card);display:grid;place-items:center}
.ib:hover{background:var(--soft)}
.tt{font-size:13px;font-weight:600;color:var(--ac);background:var(--soft);border:0;border-radius:10px;padding:9px 12px}
.calc{height:100%;display:flex;flex-direction:column}
.cal{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px 6px 6px;gap:4px}
.cal .g{gap:4px}
.calc .ch{padding:12px 14px}
.gd{flex:1;min-height:0;grid-auto-rows:1fr}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dw{text-align:center;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:6px 0}
.d{position:relative;min-height:0;border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:8px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;transition:.15s}
.d:hover{border-color:var(--ac2);transform:translateY(-1px);box-shadow:var(--sh)}
.d.e{visibility:hidden}
.d .n{font-size:15px;font-weight:600}
.d.t .n{background:var(--ac);color:#fff;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px}
.d .b{font-size:10.5px;font-weight:600;color:var(--ok);background:var(--okb);border-radius:99px;padding:2px 7px;align-self:flex-start}
.lg{display:flex;gap:16px;padding:0 18px 16px;font-size:12px;color:var(--mut)}
.sb{position:relative;display:flex;align-items:center;gap:16px;padding:18px}
.pr{flex:1}
.pr small{color:var(--mut);font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--bd);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ok));border-radius:99px}
h3.sec{margin:22px 4px 10px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.sl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.s{padding:14px}
.sh2{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.sh2 b{font-size:14.5px;font-weight:600}
.cnt{font-size:11px;font-weight:600;border-radius:99px;padding:3px 8px;background:var(--bd);color:var(--mut);white-space:nowrap}
.cnt.ok{background:var(--okb);color:var(--ok)}
.ph{display:grid;grid-template-columns:repeat(auto-fill,120px);gap:10px}
.ph>div{position:relative}
.ph img{width:120px;height:120px;object-fit:cover;border-radius:12px;border:1px solid var(--bd);display:block;cursor:zoom-in}
.x.arm{width:auto;padding:0 10px;border-radius:14px;background:var(--dn);font-size:12px;font-weight:600}
.x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(15,23,42,.72);color:#fff;font-size:16px;line-height:1;display:grid;place-items:center}
.up{width:120px;height:120px;aspect-ratio:1/1;padding:6px;text-align:center;border:1.5px dashed var(--ac2);background:var(--soft);color:var(--ac);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600}
.up:hover{filter:brightness(.97)}
.up.l{opacity:.6;pointer-events:none}
.sd{font-size:18px;font-weight:700;letter-spacing:-.02em;color:var(--tx)}
.fo{display:flex;align-items:center;gap:14px;padding:18px;text-align:left;transition:.15s}
.fo:hover{border-color:var(--ac2);transform:translateY(-1px)}
.fo .ic{width:48px;height:48px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:24px}
.fo b{display:block;font-size:15px;font-weight:600}
.fo small{color:var(--mut);font-size:12.5px}
#sp{position:fixed;inset:0;z-index:50;background:linear-gradient(135deg,var(--h1,#0f2a6b),var(--h2,#1d4ed8) 55%,var(--h3,#3b82f6));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;transition:opacity .6s,transform .6s}
#sp.out{opacity:0;transform:scale(1.06);pointer-events:none}
.lgo{width:96px;height:96px;border-radius:28px;background:rgba(255,255,255,.16);display:grid;place-items:center;animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
.lgo path,.lgo rect{stroke-dasharray:80;stroke-dashoffset:80;animation:dr 1.2s .3s ease forwards}
#sp h1{margin:8px 0 0;padding:0 16px;text-align:center;font-size:min(22px,5.8vw);letter-spacing:-.02em;animation:up .8s .7s both}
#sp p{margin:0;opacity:.8;animation:up .8s .95s both}
.ld{width:140px;height:4px;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden;animation:up .6s 1.1s both}
.ld i{display:block;height:100%;width:0;background:#fff;border-radius:9px;animation:ld 1.5s 1.1s ease forwards}
@keyframes pop{from{transform:scale(.3) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes ld{to{width:100%}}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tl{aspect-ratio:1/1;padding:14px;width:100%;align-items:center;justify-content:center;text-align:center}
.tl .tn{font-size:14px;font-weight:600;line-height:1.25}
.mt{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
.mc{display:flex;flex-direction:column;gap:6px;padding:12px 14px}
.mc span{font-size:12px;font-weight:600;color:var(--mut)}
.mc input{font:inherit;font-size:18px;font-weight:600;color:var(--tx);background:transparent;border:0;border-bottom:1.5px solid var(--bd);border-radius:0;padding:4px 0;width:100%;min-width:0;outline:none}
.mc input:focus{border-color:var(--ac2)}
.cp{padding:14px;gap:10px}
.cp>span{font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.da{display:flex;gap:8px;align-items:center}
.cp input{font:inherit;font-size:15px;font-weight:600;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:0 10px;height:40px;width:100%;min-width:0;outline:none}
.cp input:focus{border-color:var(--ac2);box-shadow:0 0 0 3px var(--soft)}
.cp .ti{width:68px;flex:none;padding:0 6px;font-size:13px;text-align:center}
.da button{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;background:#e2e8f0;color:#000;border:0;border-radius:10px;font-size:13px;font-weight:600;white-space:nowrap;flex:none;transition:background .25s,transform .15s}
.da button:active{transform:scale(.96)}
.mc .da button span{color:inherit;font-size:inherit;font-weight:inherit;letter-spacing:0;text-transform:none}
.da button.ok{background:var(--ok);color:#000}
#dl{display:flex;flex-direction:column;gap:6px}
.dr{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:4px 6px 4px 10px}
.cp .dr input{border:0;background:transparent;box-shadow:none;height:32px;padding:0;border-radius:0;font-size:13px}
.cp .dr .ti{width:60px;padding:0 4px;font-weight:500;color:var(--mut)}
#tdv{font-size:20px;font-weight:800;color:var(--tx)}
.mc.td>span{font-weight:800;color:var(--tx)}
#tds{font-size:12px;font-weight:500;color:var(--mut)}
.rs{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px dashed var(--bd);border-radius:12px;padding:6px 6px 6px 12px}
.rs label{display:flex;flex-direction:column;font-size:13px;font-weight:700;color:var(--dn)}
.rs label small{font-size:11px;font-weight:500;color:var(--mut)}
.cp .rs input{width:124px;height:34px;text-align:right;flex:none}
.dvb{flex:1;text-align:left;background:none;border:0;padding:0;height:32px;font-size:13px;font-weight:600;color:var(--tx)}
#dd{position:fixed;inset:0;background:var(--bg);z-index:25;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#dd.open{display:flex}
.dh{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd);font-weight:700;font-size:16px}
.db{flex:1;overflow-y:auto;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.dc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.dc>label,.dg2 label{display:block;margin-bottom:6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:700}
.dc input{font:inherit;font-size:16px;font-weight:600;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:0 10px;height:42px;width:100%;min-width:0;outline:none}
.dc input:focus{border-color:var(--ac2);box-shadow:0 0 0 3px var(--soft)}
.dg2{display:flex;gap:10px}
.nr{display:grid;grid-template-columns:64px 84px 1fr;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--bd)}
.nr:first-of-type{border-top:0}
.nr b{font-size:15px}
.nr input{text-align:center}
.nr span{text-align:right;font-weight:600;font-size:14px}
.sr{display:flex;justify-content:space-between;align-items:center}
.sr span{font-size:13px;font-weight:600;color:var(--mut)}
.sr b{font-size:20px}
.df{margin-top:6px;font-size:13px;font-weight:600;color:var(--mut)}
.df.ok{color:var(--ok)}
.df.no{color:var(--dn)}
.dx{background:none;border:1px solid var(--dn);color:var(--dn);border-radius:12px;height:44px;font-weight:700;font-size:15px}
.dk.off{background:var(--bd);color:var(--mut)}
.dc input[readonly]{opacity:.7}
.dk{background:var(--ac);color:#fff;border:0;border-radius:12px;height:46px;font-weight:700;font-size:15px}
.x2{width:28px;height:28px;flex:none;border-radius:50%;border:0;background:var(--bd);color:var(--mut);font-size:16px;line-height:1}
.dt{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;color:var(--mut)}
.dt b{font-size:16px;font-weight:700;color:var(--tx)}
.up{position:relative;overflow:hidden}
.fi{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
header,footer{flex:none;background:linear-gradient(120deg,var(--h1,#0f2a6b),var(--h2,#1d4ed8) 60%,var(--h3,#3b82f6))}
header{padding-top:env(safe-area-inset-top,0px)}
footer{height:36px}
.top{height:max(0px,12px - env(safe-area-inset-top,0px))}
button#tb{right:calc(8px + env(safe-area-inset-right,0px))}
#tp{position:fixed;right:calc(8px + env(safe-area-inset-right,0px));bottom:calc(44px + env(safe-area-inset-bottom,0px));display:none;flex-direction:column;gap:6px;width:236px;padding:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);z-index:20}
#tp.open{display:flex}
#tp h4{margin:2px 2px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700}
.sg{display:flex;flex-wrap:wrap;gap:8px 6px}
.sx{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;background:none;border:0;padding:0;font-size:10.5px;color:var(--mut)}
.sw{display:block;width:38px;height:38px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--bd)}
.sx.on{color:var(--tx);font-weight:600}
.sx.on .sw{box-shadow:0 0 0 3px var(--ac)}
#di,#dh{font-size:13px}
#tp{max-height:calc(100vh - 90px);overflow-y:auto}
.wh{position:relative;width:180px;height:180px;margin:4px auto}
.wh canvas{display:block;width:100%;height:100%;border-radius:50%;touch-action:none;box-shadow:0 0 0 1px var(--bd)}
.wh i{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.45);pointer-events:none}
.wl{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mut)}
.wl input{width:100%;accent-color:var(--ac)}
.wi{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px}
.wsw{width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 1px var(--bd)}
:root{--tq:#0b9eb3}
.cp input:disabled{opacity:.45}
.tg .d.f{background:var(--soft);border-color:var(--ac2)}
.ph>div{background:var(--bd);border-radius:12px}
.ph img:not([src]){visibility:hidden}
.d.hol .n{color:var(--tq)}
.d.t.hol .n{color:#fff}
.hl{max-width:100%;font-size:8.5px;line-height:1.1;font-weight:600;color:var(--tq);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;text-align:left}
.hn{font-size:12px;font-weight:600;color:var(--dn);letter-spacing:0}
.gd .d .n{width:28px;height:28px;display:grid;place-items:center;border:2px solid transparent;border-radius:50%}
.gd .d.t .n{background-clip:padding-box}
.gd .d.f .n{border-color:var(--tq)}
.mnu{position:fixed;right:14px;bottom:calc(var(--fh,36px) + 76px + env(safe-area-inset-bottom,0px));min-width:190px;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:6px;display:none;z-index:15}
.mnu.open{display:block}
.bkr{display:flex;align-items:center;margin:2px 0 4px}
.bkm{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px 0 7px;border-radius:999px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh);font-weight:700;font-size:15px;color:var(--tx);transition:transform .15s}
.bkm:active{transform:scale(.96)}
.bkm svg{width:28px;height:28px;padding:5px;border-radius:50%;background:var(--soft);color:var(--ac)}
#kb{position:fixed;right:14px;bottom:calc(var(--fh,36px) + 14px + env(safe-area-inset-bottom,0px));width:50px;height:50px;border-radius:50%;box-shadow:var(--sh);z-index:16}
.mn{display:flex;align-items:center;padding:12px;border-radius:10px;font-size:15px;font-weight:600;color:var(--tx);background:none;border:0;width:100%;text-align:left;cursor:pointer}
.mn:active{background:var(--soft)}
.mn.rd{color:var(--dn)}
.mn.off{opacity:.4;pointer-events:none}
.dbar{display:flex;gap:10px;margin-top:12px}
.dbar button{flex:1;height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-weight:700}
.dbar .dg{background:var(--dn);border-color:var(--dn);color:#fff}
.dbar .dg.off{opacity:.4;pointer-events:none}
.sel{position:absolute;top:6px;right:6px;width:26px;height:26px;padding:0;border-radius:50%;border:2px solid #fff;background:rgba(15,23,42,.35);display:grid;place-items:center;color:#fff;font-size:15px;line-height:1}
.sel.on{background:var(--ac)}
.sel.on::after{content:"✓"}
.gd .d.hold{transform:scale(.93);box-shadow:inset 0 0 0 2px var(--dn);transition:transform .7s linear}
.gd .d{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#wl{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;max-width:520px;margin:0 auto;z-index:38;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:16px;box-shadow:var(--sh);padding:12px 14px;transform:translateY(-160%);opacity:0;transition:transform .5s cubic-bezier(.2,.9,.3,1.1),opacity .3s}
#wl.show{transform:none;opacity:1}
#wl .wi2{font-size:26px}
#wl b{display:block;font-size:15px}
#wl span:not(.wi2){font-size:13px;color:var(--mut)}
.calc .ch h2{text-decoration:underline;text-decoration-color:#000;text-decoration-thickness:3px;text-underline-offset:7px}
.nmb::after{content:"";position:absolute;left:0;bottom:-3px;height:2px;width:0;background:var(--ac);border-radius:2px}
.nmb.hold15::after{width:100%;transition:width 15s linear}
#nm{position:fixed;inset:0;background:rgba(2,6,23,.55);display:none;align-items:center;justify-content:center;z-index:45;padding:20px}
.mb input{font:inherit;font-size:16px;width:100%;height:44px;border:1px solid var(--bd);border-radius:10px;padding:0 12px;background:var(--bg);color:var(--tx);margin-bottom:14px;outline:none}
.mb input:focus{border-color:var(--ac2)}
.mbt .pk{background:var(--ac);border-color:var(--ac);color:#fff}
.nmb{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;flex:none;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;color:var(--tx);border:0;border-radius:0;padding:0;font-weight:700;font-size:16px}
#md{position:fixed;inset:0;background:rgba(2,6,23,.55);display:none;align-items:center;justify-content:center;z-index:35;padding:20px}
.mb{background:var(--card);border-radius:18px;padding:18px;max-width:340px;width:100%;box-shadow:var(--sh)}
.mb h3{margin:0 0 6px;font-size:17px}
.mb p{margin:0 0 16px;color:var(--mut);font-size:14px}
.mbt{display:flex;gap:10px;justify-content:flex-end}
.mbt button{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:10px 16px;font-weight:600}
.mbt .dg{background:var(--dn);border-color:var(--dn);color:#fff}
#fs,#tb{position:fixed;right:calc(8px + env(safe-area-inset-right,0px));bottom:calc(5px + env(safe-area-inset-bottom,0px));width:26px;height:26px;padding:0;border:0;border-radius:8px;background:transparent;color:#fff;opacity:.7;display:grid;place-items:center;z-index:10}
#fs:hover,#fs:active,#tb:hover,#tb:active{opacity:1}
.hid{display:none}
#v{position:fixed;inset:0;background:rgba(2,6,23,.94);display:none;align-items:center;justify-content:center;z-index:30;overflow:hidden;touch-action:none;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
